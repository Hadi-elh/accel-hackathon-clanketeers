<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReguLine</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ReguLine</h1>
    <p class="profile-line" id="profile-line">Loading profile…</p>
    <p class="subtitle">Official Dutch publications matching this company's monitoring profile.
      Evidence shown; commercial decisions stay human.</p>
  </header>

  <div class="panels">
    <div class="panel" id="panel-stream">
      <h3>Today's publication stream</h3>
      <div id="panel-stream-body">Loading…</div>
    </div>
    <div class="panel" id="panel-decisions">
      <h3>How signals were decided</h3>
      <div id="panel-decisions-body">Loading…</div>
    </div>
  </div>

  <div id="status" class="status-line">Loading signals…</div>
  <div id="feed" class="feed"></div>
  <div id="no-text-note" class="no-text-note"></div>
  <div id="failed-note" class="no-text-note"></div>

  <footer class="bottom">
    <a href="/benchmark">Model evaluation &amp; benchmark →</a>
  </footer>
</div>

<script>
const TIER_LABELS = {
  HIGH: "HIGH RELEVANCE",
  MEDIUM: "MEDIUM RELEVANCE",
  LOW: "LOW RELEVANCE",
  NEEDS_REVIEW: "NEEDS REVIEW",
};

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function decidedByLabel(modelUsed) {
  if (!modelUsed || modelUsed === "none") return "Classification failed";
  if (modelUsed.startsWith("rules:")) return "Deterministic rules (no model call)";
  if (modelUsed.includes("gpt-oss")) return "gpt-oss-120b";
  if (modelUsed.includes("Nemotron")) return "Nemotron Nano";
  return modelUsed;
}

function locationLine(municipality, distanceKm) {
  const muni = municipality || "Unknown municipality";
  if (distanceKm === null || distanceKm === undefined) {
    return `${escapeHtml(muni)} · Location not published`;
  }
  return `${escapeHtml(muni)} · ${distanceKm} km`;
}

function whyItems(signal) {
  const checks = signal.checks || {};
  const items = [];
  if (checks.property_match) {
    items.push(`Monitored property type: ${escapeHtml(signal.property_type)}`);
  }
  if (checks.services_match) {
    const services = (signal.matched_services || []).join(", ");
    items.push(`Related configured services: ${escapeHtml(services)}`);
  }
  if (checks.inside_radius) {
    items.push("Inside monitoring radius");
  }
  return items;
}

function renderCard(signal) {
  const tierLabel = TIER_LABELS[signal.tier] || signal.tier;
  const title = signal.project_type || signal.title || "Untitled publication";
  const why = whyItems(signal);

  const whyHtml = why.length
    ? `<ul class="why">${why.map(w => `<li>${w}</li>`).join("")}</ul>`
    : "";

  return `
    <article class="card">
      <span class="tier ${escapeHtml(signal.tier)}">${escapeHtml(tierLabel)}</span>
      <h2>${escapeHtml(title)}</h2>
      <p class="meta-line">${locationLine(signal.municipality, signal.checks && signal.checks.distance_km)}
        · ${escapeHtml(signal.published_on || "")}</p>
      ${whyHtml}
      <p class="evidence-label">Official evidence</p>
      <blockquote class="evidence">${escapeHtml(signal.evidence)}</blockquote>
      <p class="reason">${escapeHtml(signal.reason)}</p>
      <p class="decided-label">Decided by</p>
      <p class="decided-value">${decidedByLabel(signal.model_used)}</p>
      <a class="source-link" href="${escapeHtml(signal.source_url)}" target="_blank" rel="noopener">
        View official publication →
      </a>
    </article>
  `;
}

async function loadSignals() {
  const statusEl = document.getElementById("status");
  const feedEl = document.getElementById("feed");
  const profileLineEl = document.getElementById("profile-line");
  const noTextEl = document.getElementById("no-text-note");
  const failedEl = document.getElementById("failed-note");

  try {
    const res = await fetch("/api/signals?profile_id=vandijk");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const p = data.profile || {};
    profileLineEl.textContent =
      `${p.name || "Unknown company"} (fictional demo profile) · Electrical installation ` +
      `· Amsterdam · ${p.radius_km !== undefined ? p.radius_km : "?"} km radius`;

    if (!data.signals || data.signals.length === 0) {
      statusEl.textContent = "No matching publications yet.";
      statusEl.classList.remove("error");
      feedEl.innerHTML = "";
    } else {
      statusEl.remove();
      feedEl.innerHTML = data.signals.map(renderCard).join("");
    }

    if (data.no_text_count && data.no_text_count > 0) {
      noTextEl.textContent =
        `${data.no_text_count} publications had no retrievable text and were not classified.`;
    }
    if (data.failed_count && data.failed_count > 0) {
      failedEl.textContent = `${data.failed_count} publications could not be classified.`;
    }
  } catch (err) {
    statusEl.textContent = "Could not load signals.";
    statusEl.classList.add("error");
    profileLineEl.textContent = "Van Dijk Techniek (fictional demo profile)";
  }
}

function panelRow(label, value) {
  return `<div class="row"><span>${escapeHtml(label)}</span><span class="v">${escapeHtml(String(value))}</span></div>`;
}

function renderStreamStats(s) {
  const na = "—";
  const rows = [
    panelRow("Fetched", s.fetched ?? na),
    panelRow("Kept by deterministic filters", s.kept ?? na),
    panelRow("Inside radius", s.plausible_rubriek ?? na),
    panelRow("Location not published", s.location_unknown_kept ?? na),
  ].join("");
  const lastScan = (s.source === "scan_runs" && s.last_scan)
    ? `<div class="last-scan">Last scan: ${escapeHtml(s.last_scan)}</div>` : "";
  return rows + lastScan;
}

function renderDecisionStats(d) {
  const na = "—";
  const cost = (d.total_cost_eur === null || d.total_cost_eur === undefined)
    ? na : `€${d.total_cost_eur.toFixed(4)}`;
  const rows = [
    panelRow("Deterministic rules · €0 · no model call", d.rule_rejected ?? na),
    panelRow("gpt-oss-120b", d.gpt_oss ?? na),
  ];
  if (d.nemotron) {
    rows.push(panelRow("Nemotron Nano", d.nemotron));
  }
  rows.push(panelRow("Total model cost", cost));
  const lastScan = (d.source === "scan_runs" && d.last_scan)
    ? `<div class="last-scan">Last scan: ${escapeHtml(d.last_scan)}</div>` : "";
  return rows.join("") + lastScan;
}

async function loadStreamStats() {
  const el = document.getElementById("panel-stream-body");
  try {
    const res = await fetch("/api/stream_stats?profile_id=vandijk");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    el.innerHTML = renderStreamStats(await res.json());
  } catch (err) {
    el.textContent = "—";
  }
}

async function loadDecisionStats() {
  const el = document.getElementById("panel-decisions-body");
  try {
    const res = await fetch("/api/decision_stats?profile_id=vandijk");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    el.innerHTML = renderDecisionStats(await res.json());
  } catch (err) {
    el.textContent = "—";
  }
}

// Three independent fetches -- the feed, and each panel -- never chained.
// A slow or failing panel never blocks the feed or the other panel.
loadSignals();
loadStreamStats();
loadDecisionStats();
</script>
</body>
</html>
